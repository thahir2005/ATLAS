name: ATLAS Container Publish

on:
  push:
    branches:
      - main
      - feature/independent-monitoring
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'services/region-api/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/atlas-region-api
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/atlas-region-api:sha-${{ github.sha }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/atlas-region-api:sha-${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-container-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign container image with Cosign
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/atlas-region-api
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Update Kubernetes image manifests
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          path = Path("infra/kubernetes/atlas-regions.yaml")
          content = path.read_text()
          image = f"ghcr.io/{os.environ['REPOSITORY_OWNER']}/atlas-region-api:"
          updated, count = re.subn(
              re.escape(image) + r"[^\s]+",
              image + os.environ["IMAGE_TAG"],
              content
          )
          if count != 3:
              raise SystemExit(f"Expected 3 image references, found {count}")
          path.write_text(updated)
          PYTHON

      - name: Commit and push GitOps manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/kubernetes/atlas-regions.yaml
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "deploy: update ATLAS region API image"
          git push origin HEAD:${GITHUB_REF_NAME}
