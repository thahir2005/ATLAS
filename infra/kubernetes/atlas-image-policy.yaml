apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: atlas-verify-cosign-signatures
  annotations:
    policies.kyverno.io/title: ATLAS Cosign Signature Verification
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/minversion: 1.20.0
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/thahir2005/atlas-region-api:*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: false
    required: true
  attestors:
    - name: github
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/thahir2005/ATLAS/.github/workflows/publish-image.yml@refs/heads/feature/independent-monitoring"
        ctlog:
          url: "https://rekor.sigstore.dev"
  variables:
    - name: allImages
      expression: >-
        images.?containers.orValue([]) +
        images.?initContainers.orValue([]) +
        images.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allImages.map(image,
          verifyImageSignatures(image, [attestors.github])
        ).all(result, result > 0)
      message: "ATLAS images must have a valid Cosign signature from the trusted GitHub Actions workflow."
