apiVersion: apps/v1
kind: Deployment
metadata:
  name: frankfurt-api
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frankfurt-api
  template:
    metadata:
      labels:
        app: frankfurt-api
        region: frankfurt
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "atlas-api"
        vault.hashicorp.com/agent-service-account-token-volume-name: "vault-token"
        vault.hashicorp.com/agent-inject-secret-db-creds: "atlas/data/database"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "atlas/data/database" -}}
          username={{ .Data.data.username }}
          environment={{ .Data.data.environment }}
          {{- end }}
    spec:
      volumes:
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: vault
                  expirationSeconds: 3600
                  path: token
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: regional-api
          image: ghcr.io/thahir2005/atlas-region-api:sha-015cdc1520e5708bb8f8b35384b16c099590148d@sha256:e4f9200993d3f1c555ad836186ed336e660c6c5696e05bc721cd9cb7960216be
          imagePullPolicy: IfNotPresent
          args: ["--listen=:8080", "--region=Frankfurt"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 160Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frankfurt-api
  namespace: atlas
spec:
  selector:
    app: frankfurt-api
  ports:
    - port: 8080
      targetPort: 8080
