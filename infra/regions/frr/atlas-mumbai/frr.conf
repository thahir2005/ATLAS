frr defaults traditional
hostname atlas-mumbai
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 10.10.1.1
 no bgp ebgp-requires-policy
 neighbor 172.20.12.2 remote-as 65002
 neighbor 172.20.31.1 remote-as 65003
 !
 address-family ipv4 unicast
  network 10.10.1.1/32
  neighbor 172.20.12.2 activate
  neighbor 172.20.31.1 activate
 exit-address-family
!
line vty
