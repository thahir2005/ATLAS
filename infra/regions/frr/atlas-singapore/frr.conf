frr defaults traditional
hostname atlas-singapore
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.10.2.1
 no bgp ebgp-requires-policy
 neighbor 172.20.12.1 remote-as 65001
 neighbor 172.20.23.2 remote-as 65003
 !
 address-family ipv4 unicast
  network 10.10.2.1/32
  neighbor 172.20.12.1 activate
  neighbor 172.20.23.2 activate
 exit-address-family
!
line vty
