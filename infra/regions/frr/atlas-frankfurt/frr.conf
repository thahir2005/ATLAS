frr defaults traditional
hostname atlas-frankfurt
service integrated-vtysh-config
!
router bgp 65003
 bgp router-id 10.10.3.1
 no bgp ebgp-requires-policy
 neighbor 172.20.23.1 remote-as 65002
 neighbor 172.20.31.2 remote-as 65001
 !
 address-family ipv4 unicast
  network 10.10.3.1/32
  neighbor 172.20.23.1 activate
  neighbor 172.20.31.2 activate
 exit-address-family
!
line vty
